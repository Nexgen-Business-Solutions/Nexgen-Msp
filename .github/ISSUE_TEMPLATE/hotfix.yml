name: Hotfix
description: Urgent fix for a critical production issue
title: "[Hotfix]: "
type: "Hot Fix"
labels: []
assignees: []

body:
  - type: textarea
    id: description
    attributes:
      label: Issue description
      description: Describe the production issue and why it requires an urgent fix.
      placeholder: Explain what is broken and who is affected.
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Fix required
      description: Describe the changes required or already implemented.
      placeholder: Explain the minimum changes needed to fix the issue.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Describe the business or customer impact.
      placeholder: "Example: Payments are failing for all customers."
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Explain how the hotfix will be tested and verified.
      placeholder: |
        - Test on staging
        - Deploy to production
        - Verify the affected workflow
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: Rollback plan
      description: Explain how to revert the hotfix if it causes a problem.
      placeholder: "Example: Revert the hotfix commit and redeploy the previous version."
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Logs, screenshots, or notes
      description: Add any supporting logs, screenshots, API details, or references.
    validations:
      required: false

  - type: checkboxes
    id: definition_of_done
    attributes:
      label: Definition of done
      options:
        - label: Hotfix is implemented
        - label: Hotfix is tested
        - label: Hotfix is deployed
        - label: Production behavior is verified
    validations:
      required: false
      
  - type: input
    id: testing-link
    attributes:
      label: Kiwi TCMS Test Plan or Test Case
      description: Link the relevant Kiwi TCMS test plan, test case, or test execution.
      placeholder: https://kiwitcms.example.com/...
    validations:
      required: true
      
  - type: input
    id: planned-start-date
    attributes:
      label: Planned Start date
      description: Enter the planned start date using YYYY-MM-DD.
      placeholder: "YYYY-MM-DD"
    validations:
      required: true

  - type: input
    id: planned-end-date
    attributes:
      label: Planned End date
      description: Enter the planned completion date using YYYY-MM-DD.
      placeholder: "YYYY-MM-DD"
    validations:
      required: true

  - type: textarea
    id: responsible-assignees
    attributes:
      label: Responsible assignees
      description: >
        Enter one or more GitHub usernames, separated by commas or new lines.
        Do not include display names or email addresses.
      placeholder: |
        @developer-one
        @developer-two
    validations:
      required: true
